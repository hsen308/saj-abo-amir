<script>
/* ------------------------------------------------------------------
   MENU SOURCE
   Order of preference:
     1. the published Google Sheet (owner edits this from a phone)
     2. data/menu.json (used by admin.html, and by tools/export-csv.js)
     3. the inline defaults further down this file, so the page always renders

   To connect a sheet, set SHEET_CSV below to its published URL, e.g.
     https://docs.google.com/spreadsheets/d/e/XXXXXXXX/pub?output=csv
   Leave it as an empty string to skip the sheet entirely.
------------------------------------------------------------------ */
var SHEET_CSV = "";
var SHEET_CACHE_MINUTES = 5;

window.MENU_OVERRIDE = null;
window.MENU_SOURCE = "inline";

function parseCSV(text) {
  var rows = [], row = [], field = "", inQ = false;
  for (var i = 0; i < text.length; i++) {
    var c = text[i];
    if (inQ) {
      if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else inQ = false; }
      else field += c;
    } else if (c === '"') inQ = true;
    else if (c === ",") { row.push(field); field = ""; }
    else if (c === "\n") { row.push(field); rows.push(row); row = []; field = ""; }
    else if (c !== "\r") field += c;
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows.filter(function (r) { return r.length && r.some(function (x) { return String(x).trim() !== ""; }); });
}

/* Columns, in the order tools/export-csv.js writes them. */
function sheetToData(text) {
  var rows = parseCSV(text);
  if (rows.length < 2) return null;
  var head = rows.shift().map(function (h) { return h.trim(); });
  var need = ["show", "category", "name_en", "name_ar", "price", "id"];
  for (var n = 0; n < need.length; n++) if (head.indexOf(need[n]) < 0) return null;
  var at = function (r, k) { var i = head.indexOf(k); return i < 0 ? "" : String(r[i] === undefined ? "" : r[i]).trim(); };

  var items = [];
  for (var r = 0; r < rows.length; r++) {
    var row = rows[r];
    var id = at(row, "id"), cat = at(row, "category");
    if (!id || !cat) continue;
    if (at(row, "show") === "no") continue;
    items.push({
      id: id, cat: cat,
      en: at(row, "name_en"), ar: at(row, "name_ar"),
      dEn: at(row, "desc_en"), dAr: at(row, "desc_ar"),
      price: at(row, "price"),
      tags: at(row, "tags") ? at(row, "tags").split(/\s+/).filter(Boolean) : [],
      bread: cat
    });
  }
  if (!items.length) return null;
  /* The sheet carries items only. Keep shop details and combos from the
     next source so one missing column cannot wipe the phone numbers. */
  return { items: items, fromSheet: true };
}

function loadSheet() {
  if (!SHEET_CSV) return Promise.resolve(null);
  /* Google caches published sheets aggressively. The cache buster is what
     keeps his price change from taking ten minutes to appear. */
  var url = SHEET_CSV + (SHEET_CSV.indexOf("?") < 0 ? "?" : "&") +
            "cachebust=" + Date.now();
  return fetch(url, { cache: "no-store", redirect: "follow" })
    .then(function (r) { return r.ok ? r.text() : null; })
    .then(function (t) {
      var d = t ? sheetToData(t) : null;
      if (d) window.MENU_SOURCE = "sheet";
      return d;
    })
    .catch(function () { return null; });
}

window.MENU_READY = loadSheet()
  .then(function (d) {
    if (d) return d;
    return fetch("data/menu.json", { cache: "no-store" })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) { if (j && j.items) { window.MENU_SOURCE = "json"; return j; } return null; })
      .catch(function () { return null; });
  })
  .then(function (j) { if (j) window.MENU_OVERRIDE = j; })
  .catch(function () {});
</script>
<style>
/* ---------- tokens ---------- */
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);

  --bg:#FBF9F5;
  --surface:#FFFFFF;
  --surface2:#F3F0E9;
  --ink:#1B1815;
  --ink2:#3D372F;
  --muted:#6A6259;
  --line:#E6E1D7;
  --line2:#EFEBE3;

  --accent:#B8431A;
  --accent-soft:#FAEDE7;
  --olive:#4F6138;
  --wa:#0E7A3C;

  --btn-bg:#1B1815;
  --btn-ink:#FBF9F5;

  --nav-bg:rgba(251,249,245,.86);
  --strip:#1B1815;
  --strip-ink:#E9E3D8;

  --r-sm:10px;
  --r-md:14px;
  --r-lg:18px;
  --r-pill:999px;

  --ease:cubic-bezier(.2,.7,.3,1);
  --shadow-1:0 1px 2px rgba(27,24,21,.05);
  --shadow-2:0 16px 32px -22px rgba(27,24,21,.30);

  --disp:'Bricolage Grotesque','Figtree',system-ui,sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}

*,*::before,*::after{box-sizing:inherit}
html{
  scroll-behavior:smooth;
  scroll-padding-top:calc(env(safe-area-inset-top,0px) + 112px);
  -webkit-text-size-adjust:100%;
  -webkit-tap-highlight-color:transparent;
}
body{
  margin:0;color:var(--ink);
  font-family:var(--body);font-weight:400;
  font-size:16px;line-height:1.6;padding-bottom:86px;overflow-x:hidden;
  background-color:var(--bg);
  background-image:radial-gradient(120% 46% at 78% -6%, rgba(184,67,26,.07), transparent 62%);
  background-repeat:no-repeat;
}
html[lang="ar"] body{font-family:'Cairo',var(--body);line-height:1.75}
h1,h2{font-family:var(--disp);margin:0;line-height:1.02;letter-spacing:-.03em;font-weight:800}
html[lang="ar"] h1,html[lang="ar"] h2{font-family:'Cairo',sans-serif;letter-spacing:0;line-height:1.3}
h1{font-variation-settings:'opsz' 96}
h2{font-variation-settings:'opsz' 48}
h3,h4{margin:0;font-weight:700;line-height:1.25;letter-spacing:-.018em;font-family:var(--disp)}
html[lang="ar"] h1,html[lang="ar"] h2,html[lang="ar"] h3,html[lang="ar"] h4{font-family:'Cairo',sans-serif;letter-spacing:0}
p{margin:0}
a{color:inherit}
button,select{font:inherit;color:inherit;touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
.wrap{max-width:1020px;margin-inline:auto;padding-inline:20px}
.skip{position:absolute;inset-inline-start:12px;top:-70px;z-index:200;background:var(--ink);color:var(--btn-ink);
  padding:11px 17px;border-radius:var(--r-sm);font-weight:600;text-decoration:none;transition:top .2s}
.skip:focus{top:12px}

/* ---------- reveal ---------- */
.reveal{opacity:0;transform:translateY(14px);
  transition:opacity .5s var(--ease),transform .5s var(--ease)}
.reveal.in{opacity:1;transform:none}

/* ---------- top strip + nav ---------- */
.strip{background:var(--strip);color:var(--strip-ink);font-size:.74rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.strip .wrap{display:flex;flex-wrap:wrap;gap:2px 16px;justify-content:space-between;padding-block:9px}
.strip .wrap span:first-child{color:#F0C89A}

.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--nav-bg);
  -webkit-backdrop-filter:blur(14px) saturate(160%);backdrop-filter:blur(14px) saturate(160%);
  border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:0 10px;padding-block:10px 0}
.brand{font-family:var(--disp);font-weight:800;font-size:1.2rem;text-decoration:none;letter-spacing:-.025em;
  display:inline-flex;align-items:center;gap:9px}
.brand::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
html[lang="ar"] .brand{font-family:'Cairo',sans-serif}
.lang{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-pill);
  padding:0 16px;height:44px;font-weight:700;font-size:.9rem;cursor:pointer;color:var(--ink2);
  transition:border-color .2s,color .2s,background .2s}
.lang:hover{border-color:var(--ink);color:var(--ink)}
.links{order:3;width:100%;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-block:6px 8px}
.links::-webkit-scrollbar{display:none}
.links a{white-space:nowrap;text-decoration:none;font-weight:600;font-size:.94rem;
  padding:8px 13px;border-radius:var(--r-pill);color:var(--muted);
  transition:color .2s,background .2s}
.links a:hover{background:var(--surface2);color:var(--ink)}
.links a.on{color:var(--ink);font-weight:700;background:var(--surface2)}
@media(min-width:820px){
  .nav .wrap{flex-wrap:nowrap;padding-block:12px}
  .links{order:0;width:auto;padding:0;overflow:visible}
}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:50px;padding:0 24px;
  border-radius:var(--r-pill);font-weight:700;font-family:var(--disp);text-decoration:none;
  border:1px solid transparent;cursor:pointer;
  transition:transform .18s var(--ease),background .2s,border-color .2s,color .2s,box-shadow .2s}
html[lang="ar"] .btn{font-family:'Cairo',sans-serif}
.btn:active{transform:scale(.975)}
.btn svg{width:19px;height:19px;flex:none}
.btn-primary{background:var(--btn-bg);color:var(--btn-ink)}
.btn-primary:hover{background:var(--ink2);transform:translateY(-1px);box-shadow:var(--shadow-2)}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--ink);background:var(--surface);transform:translateY(-1px)}
.btn-wa{background:var(--wa);color:#fff}
.btn-wa:hover{background:#0B6331;transform:translateY(-1px);box-shadow:var(--shadow-2)}

/* ---------- HERO ---------- */
.hero{padding-block:clamp(44px,7.5vw,88px) clamp(34px,5vw,56px)}
.hero-in{max-width:min(100%,840px)}
.hero-top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.pill{display:inline-flex;align-items:center;gap:8px;color:var(--accent);
  font-size:.76rem;font-weight:700;letter-spacing:.04em;
  padding:5px 13px;border:1px solid var(--line);border-radius:var(--r-pill);background:var(--surface)}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--accent);display:block;flex:none}
.hero-loc{font-size:.74rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.hero h1{
  margin-top:22px;
  font-size:clamp(3rem,12vw,6.6rem);
  line-height:.94;
  letter-spacing:-.04em;
  text-wrap:balance;
}
.hero .rule{width:60px;height:3px;background:var(--accent);margin-top:24px;border-radius:3px}
.hero .tag{font-family:var(--disp);font-weight:600;font-size:clamp(1.15rem,3.2vw,1.5rem);margin-top:22px;
  line-height:1.25;letter-spacing:-.02em;text-wrap:balance}
html[lang="ar"] .hero .tag{font-family:'Cairo',sans-serif;font-weight:700;letter-spacing:0;line-height:1.5}
.hero .sub{margin-top:12px;max-width:46ch;color:var(--ink2);font-weight:500;text-wrap:pretty}
.cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:30px}
.hero-meta{display:flex;flex-wrap:wrap;gap:0;margin-top:38px;border-top:1px solid var(--line);padding-top:18px}
.hero-meta div{padding-inline-end:26px;margin-inline-end:26px;border-inline-end:1px solid var(--line)}
.hero-meta div:last-child{border-inline-end:0;padding-inline-end:0;margin-inline-end:0}
.hero-meta b{display:block;font-size:.68rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.hero-meta span{display:block;margin-top:3px;font-size:.96rem;font-weight:600;color:var(--ink)}
.hero-in>*{opacity:0;animation:rise .7s var(--ease) forwards}
.hero-in>*:nth-child(1){animation-delay:.02s}
.hero-in>*:nth-child(2){animation-delay:.09s}
.hero-in>*:nth-child(3){animation-delay:.16s}
.hero-in>*:nth-child(4){animation-delay:.22s}
.hero-in>*:nth-child(5){animation-delay:.28s}
.hero-in>*:nth-child(6){animation-delay:.34s}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

/* ---------- lunch note ---------- */
.lunch{margin-top:clamp(40px,6vw,60px)}
.lunch .box{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:center;justify-content:space-between;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px 22px;box-shadow:var(--shadow-1)}
.lunch h2{font-size:1.2rem;font-variation-settings:'opsz' 36}
.lunch p{color:var(--muted);margin-top:6px;max-width:48ch;text-wrap:pretty}

/* ---------- sections ---------- */
section{padding-top:clamp(52px,7vw,84px)}
.sec-head{max-width:56ch}
.ebrow{display:block;font-family:var(--disp);font-size:.78rem;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--accent)}
html[lang="ar"] .ebrow{font-family:'Cairo',sans-serif;letter-spacing:0}
.sec-head h2{font-size:clamp(1.8rem,5.2vw,2.5rem);margin-top:10px;text-wrap:balance}
.sec-head p{color:var(--muted);margin-top:10px;max-width:54ch;text-wrap:pretty}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;margin-top:24px;padding-block:2px 6px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--line);background:transparent;border-radius:var(--r-pill);
  padding:0 19px;min-height:46px;font-weight:600;font-size:.96rem;color:var(--muted);
  cursor:pointer;white-space:nowrap;transition:color .2s,border-color .2s,background .2s}
.tab:hover{color:var(--ink);border-color:var(--ink2)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--btn-ink);border-color:var(--ink)}
.tab.healthy:not([aria-selected="true"]){border-color:#C9D2BB;color:var(--olive)}
.tab.healthy:not([aria-selected="true"]):hover{border-color:var(--olive)}

/* ---------- filter chips ---------- */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{position:relative;display:inline-flex}
.chip input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.chip span{display:inline-flex;align-items:center;min-height:44px;padding:0 17px;border-radius:var(--r-pill);
  border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:.95rem;color:var(--muted);
  transition:background .18s,border-color .18s,color .18s}
.chip span:hover{color:var(--ink);border-color:var(--ink2)}
.chip input:checked + span{background:var(--ink);border-color:var(--ink);color:var(--btn-ink)}
.note{margin-top:16px;color:var(--muted);font-size:.95rem;padding-inline-start:14px;border-inline-start:2px solid var(--line)}

/* ---------- item cards ---------- */
.grid{display:grid;gap:12px;margin-top:18px}
@media(min-width:760px){.grid{grid-template-columns:1fr 1fr}}
.item{display:flex;flex-direction:column;gap:9px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r-md);padding:16px 17px;
  animation:pop .45s var(--ease) both;
  transition:border-color .2s,box-shadow .2s,background .2s}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.item:hover{border-color:#D4CCBC;box-shadow:var(--shadow-2)}
.item .top{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.item h3{font-size:1.06rem}
.price{font-family:var(--disp);font-weight:800;font-size:1.1rem;color:var(--accent);white-space:nowrap;
  font-variant-numeric:tabular-nums}
html[lang="ar"] .price{font-family:'Cairo',sans-serif;font-weight:700}
.desc{color:var(--muted);font-size:.92rem;line-height:1.55;text-wrap:pretty}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tg{font-size:.72rem;font-weight:700;padding:2px 9px;border-radius:var(--r-pill);
  background:var(--surface2);color:var(--ink2);border:1px solid var(--line2);white-space:nowrap}
.order{margin-top:auto;padding-top:5px;display:inline-flex;align-items:center;gap:7px;
  font-size:.85rem;font-weight:700;color:var(--wa);text-decoration:none;width:fit-content}
.order svg{width:15px;height:15px;flex:none}
.order:hover{text-decoration:underline;text-underline-offset:3px}

/* ---------- combos ---------- */
.combos{margin-top:40px;padding-top:28px;border-top:1px solid var(--line)}
.combos h3{font-size:1.3rem}
.combo-grid{display:grid;gap:12px;margin-top:14px}
@media(min-width:760px){.combo-grid{grid-template-columns:1fr 1fr}}
.combo{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);
  padding:18px;display:flex;flex-direction:column;gap:10px;
  transition:border-color .2s,box-shadow .2s}
.combo:hover{border-color:#D4CCBC;box-shadow:var(--shadow-2)}
.combo .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.combo h4{font-size:1.05rem}

/* ---------- build your own ---------- */
.byo{display:grid;gap:12px;margin-top:24px}
@media(min-width:880px){.byo{grid-template-columns:1fr 1fr}}
.step{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:18px;
  transition:border-color .2s}
.step:hover{border-color:#D4CCBC}
.step-h{display:flex;align-items:center;gap:10px}
.step-n{font-size:.72rem;font-weight:700;letter-spacing:.08em;color:var(--accent);
  font-variant-numeric:tabular-nums;flex:none}
.step-n::after{content:"";display:inline-block;width:14px;height:1px;background:var(--line);
  vertical-align:middle;margin-inline-start:8px}
.step h3{font-size:1rem}
.step .chips{margin-top:13px;gap:7px}
.step .tg{font-size:.9rem;font-weight:600;padding:7px 14px;background:var(--bg);color:var(--ink2)}
.step .tg em{font-style:normal;font-size:.66rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  background:var(--olive);color:#fff;border-radius:var(--r-pill);padding:2px 8px;margin-inline-start:7px}

/* ---------- info ---------- */
.pickup{display:flex;gap:14px;align-items:center;margin-top:22px;
  background:var(--accent-soft);border:1px solid #F0D9CE;border-radius:var(--r-lg);padding:18px 20px}
.pickup svg{width:26px;height:26px;flex:none;color:var(--accent)}
.pickup b{font-family:var(--disp);font-weight:800;font-size:1.2rem;line-height:1.2;letter-spacing:-.02em}
html[lang="ar"] .pickup b{font-family:'Cairo',sans-serif}
.info{display:grid;gap:12px;margin-top:12px}
@media(min-width:880px){.info{grid-template-columns:1fr 1.1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px}
.facts{display:grid;gap:18px;align-content:start}
.fact h3{font-size:.72rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.fact p{font-weight:500;font-size:1.02rem}
.fact a.tel{font-weight:600;font-size:1.02rem;color:var(--accent);text-decoration:none;direction:ltr;
  display:inline-flex;align-items:center;min-height:44px}
.fact a.tel:hover{text-decoration:underline;text-underline-offset:3px}
.fact .hint{font-weight:400;color:var(--muted);font-size:.94rem;margin-top:4px}
.map{border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--line);min-height:320px;background:var(--surface2)}
.map iframe{display:block;width:100%;height:100%;min-height:320px;border:0}
.btns{display:flex;flex-wrap:wrap;gap:9px}

/* ---------- footer ---------- */
footer{margin-top:clamp(60px,8vw,88px);background:var(--strip);color:var(--strip-ink);padding-block:40px}
footer .wrap{display:flex;flex-wrap:wrap;gap:18px 40px;justify-content:space-between;align-items:flex-end}
footer b{font-family:var(--disp);font-weight:800;font-size:1.85rem;color:#F6F1E8;display:block;line-height:1.1;letter-spacing:-.03em}
html[lang="ar"] footer b{font-family:'Cairo',sans-serif}
footer p{color:#9C9384;font-size:.92rem;margin-top:6px;max-width:38ch}
footer a{font-weight:700;color:#F0C89A;text-decoration:none;display:inline-block;margin-top:5px;font-variant-numeric:tabular-nums}
footer a:hover{text-decoration:underline;text-underline-offset:3px}
/* footer phone links sit in their own rows, so give them a real tap height */
.foot-l a{min-height:44px;display:flex;align-items:center}

    all:"الكل", kaakeNote:"نفس حشوات الصاج، بالكعك أو بالخبز الذي تختاره.",
    combosTitle:"تركيبات مقترحة", order:"اطلب",
    ebBuild:"على طريقتك",
    buildTitle:"ركّب بنفسك", buildSub:"اختر الخبز والحشوة والخضار والصوص، ثم أرسل طلبك عبر واتساب.",
    sBread:"الخبز", sFill:"الحشوات", sVeg:"الخضار (مشمولة)", sSauce:"اختر صوصك", light:"خفيف",
    ebInfo:"بيروت",
    infoTitle:"زورونا", pickupOnly:"استلام من المحل فقط", phone:"الهاتف", hours:"ساعات العمل", findUs:"موقعنا",
    address:"بيروت، بالقرب من وزارة المالية، مقابل Beirut Digital District (BDD)، 1227",
    directionsText:"مقابل منطقة وزارة المالية مباشرة، قبالة BDD 1227.", getDirections:"احصل على الاتجاهات",
    callToOrder:"اتصل للطلب", footTag:"ساخن من الصاج، مباشرة إلى يديك.",
    hi:"مرحباً صاج أبو أمير، بدي أطلب:", on:"على",
    pre:"مرحباً صاج أبو أمير، بدي أطلب.", byoMsg:"مرحباً صاج أبو أمير، بدي ركّب صاج بنفسي."
  }
};

/* =====================================================================
   Code below does not need editing.
   ===================================================================== */
(function () {
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));

  /* Fold data/menu.json (if it loaded) into the inline defaults. */
  function applyOverride() {
    const o = window.MENU_OVERRIDE;
    if (!o || !Array.isArray(o.items)) return;
    if (o.shop) for (const k of ["phoneDisplay","tel","wa","contactDisplay","contactTel","mapQuery","hours","hoursLong","name"]) {
      if (o.shop[k] !== undefined) SHOP[k] = o.shop[k];
    }
    const byId = new Map(o.items.filter(i => i && i.id).map(i => [i.id, i]));
    const merged = ITEMS.filter(i => byId.has(i.id)).map(i => Object.assign({}, i, byId.get(i.id)));
    for (const n of o.items) {
      if (!n || !n.id || ITEMS.some(i => i.id === n.id)) continue;
      merged.push(Object.assign({ cat: "saj", en: "", ar: "", dEn: "", dAr: "", tags: [], bread: "saj", price: "X" }, n));
    }
    // A hand-edited file could miss fields the renderer assumes exist.
    for (const i of merged) {
      if (!Array.isArray(i.tags)) i.tags = i.tags ? [i.tags] : [];
      if (typeof i.price !== "string") i.price = i.price == null ? "" : String(i.price);
      i.dEn = i.dEn || ""; i.dAr = i.dAr || "";
    }
    ITEMS.length = 0;
    ITEMS.push(...merged);
    if (Array.isArray(o.combos) && o.combos.length) { COMBOS.length = 0; COMBOS.push(...o.combos); }
  }
  applyOverride();
  window.MENU_READY.then(() => {
    if (!window.MENU_OVERRIDE) return;
    applyOverride();
    try { renderAll(); } catch (e) {}
  });

  let lang = "en";
  try { lang = localStorage.getItem("saj-lang") || "en"; } catch (e) {}
  if (lang !== "ar") lang = "en";
  const t = k => UI[lang][k];
  const nm = o => o[lang];
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  const breadById = id => BREADS.find(b => b.id === id);
  const wa = text => `https://wa.me/${SHOP.wa}?text=${encodeURIComponent(text)}`;

  const WA_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 21l1.6-4.6A8.5 8.5 0 1 1 8 19.5z"/></svg>';

  /* ---------- menu ---------- */
  let cat = "healthy", tagF = "all";
  const tabDefs = () => [["healthy", t("tHealthy")], ["saj", t("tSaj")], ["kaake", t("tKaake")], ["sandwiches", t("tSand")], ["drinks", t("tDrinks")]];

  function renderTabs() {
    $("#tabs").innerHTML = tabDefs().map(([id, label]) =>
      `<button class="tab ${id === "healthy" ? "healthy" : ""}" role="tab" aria-selected="${id === cat}" data-cat="${id}">${label}</button>`).join("");
  }
  function renderTagFilter() {
    const box = $("#tagFilter");
    if (cat !== "healthy") { box.innerHTML = ""; box.hidden = true; return; }
    box.hidden = false;
    const opts = [["all", t("all")], ...Object.keys(TAGS).map(k => [k, nm(TAGS[k])])];
    box.innerHTML = opts.map(([id, label]) =>
      `<label class="chip"><input type="radio" name="tagf" value="${id}" ${id === tagF ? "checked" : ""}><span>${label}</span></label>`).join("");
  }
  function itemsForView() {
    if (cat === "healthy") return ITEMS.filter(i => i.on !== false && i.cat !== "kaake" && i.cat !== "drinks" && i.tags.length && (tagF === "all" || i.tags.includes(tagF)));
    return ITEMS.filter(i => i.on !== false && i.cat === cat);
  }
  const chosen = {};
  function orderText(i, bid) {
    const b = bid && breadById(bid);
    return `${t("hi")} ${nm(i)}${b ? " " + t("on") + " " + nm(b) : ""}`;
  }
  function cardHTML(i) {
    const bid = chosen[i.id] || i.bread;
    const desc = lang === "ar" ? i.dAr : i.dEn;
    return `<article class="item" data-id="${i.id}">
      <div class="top"><h3>${esc(nm(i))}</h3>${i.price && String(i.price).trim() ? `<span class="price">${esc(i.price)}</span>` : ""}</div>
      ${desc ? `<p class="desc">${esc(desc)}</p>` : ""}
      ${i.tags.length ? `<div class="tags">${i.tags.map(g => `<span class="tg">${nm(TAGS[g])}</span>`).join("")}</div>` : ""}
      <a class="order" target="_blank" rel="noopener" href="${wa(orderText(i, bid))}">${WA_ICON}${t("order")}</a>
    </article>`;
  }
  function renderGrid() {
    $("#grid").innerHTML = itemsForView()
      .map((i, n) => cardHTML(i).replace('class="item"', `class="item" style="animation-delay:${Math.min(n * 30, 300)}ms"`))
      .join("");
    const note = $("#catNote");
    note.hidden = cat !== "kaake";
    note.textContent = t("kaakeNote");
  }
  function renderCombos() {
    $("#combos").innerHTML = COMBOS.map(c => `<article class="combo">
      <div class="top"><h4>${esc(nm(c))}</h4>${c.price && String(c.price).trim() ? `<span class="price">${esc(c.price)}</span>` : ""}</div>
      <p class="desc">${esc(lang === "ar" ? c.dAr : c.dEn)}</p>
      <a class="order" target="_blank" rel="noopener" href="${wa(t("hi") + " " + (lang === "ar" ? c.orderAr : c.orderEn))}">${WA_ICON}${t("order")}</a>
    </article>`).join("");
  }

  document.addEventListener("click", e => {
    const tab = e.target.closest(".tab");
    if (tab) { cat = tab.dataset.cat; tagF = "all"; renderTabs(); renderTagFilter(); renderGrid(); }
  });
  document.addEventListener("change", e => {
    if (e.target.name === "tagf") { tagF = e.target.value; renderGrid(); }
  });

  /* ---------- build your own (informational only) ---------- */
  function optGroup(n, title, arr, extra) {
    return `<div class="step"><div class="step-h"><span class="step-n">0${n}</span><h3>${title}</h3></div>` +
      `<div class="chips">${arr.map(o => `<span class="tg">${nm(o)}${extra && extra(o) ? extra(o) : ""}</span>`).join("")}</div></div>`;
  }
  function renderBYO() {
    $("#byo").innerHTML =
      optGroup(1, t("sBread"), BREADS) +
      optGroup(2, t("sFill"), FILLINGS) +
      optGroup(3, t("sVeg"), VEGGIES) +
      optGroup(4, t("sSauce"), SAUCES, s => s.light ? `<em>${t("light")}</em>` : "");
    $("#byoWa").href = wa(t("byoMsg"));
  }

  /* ---------- static text + links ---------- */
  function applyStatic() {
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
    $$("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
    $("#langBtn").textContent = lang === "ar" ? "EN" : "عربي";
    const name = nm(SHOP.name);
    ["#brandName", "#heroName", "#footName"].forEach(s => { $(s).textContent = name; });
    document.title = lang === "ar" ? name + " | صاج طازج في بيروت" : name + " | Fresh saj, made to order in Beirut";
    $("#hoursTop").textContent = nm(SHOP.hours);
    $("#hoursText").textContent = nm(SHOP.hoursLong);
    $("#hoursMeta").textContent = nm(SHOP.hoursLong);
    $("#phoneText").textContent = SHOP.phoneDisplay;
    $("#footCall").textContent = SHOP.phoneDisplay;
    $("#contactTel").textContent = SHOP.contactDisplay;
    $("#footContact").textContent = SHOP.contactDisplay;
    $("#contactTel").href = "tel:" + SHOP.contactTel;
    $("#footContact").href = "tel:" + SHOP.contactTel;
    ["#heroCall", "#infoCall", "#barCall", "#footCall"].forEach(s => { $(s).href = "tel:" + SHOP.tel; });
    const pre = wa(t("pre"));
    ["#lunchWa", "#infoWa", "#barWa"].forEach(s => { $(s).href = pre; });
    $("#infoDir").href = "https://www.google.com/maps/dir/?api=1&destination=" + encodeURIComponent(SHOP.mapQuery);
    const fr = $("#mapFrame");
    const src = "https://maps.google.com/maps?q=" + encodeURIComponent(SHOP.mapQuery) + "&output=embed";
    if (fr.getAttribute("src") !== src) fr.setAttribute("src", src);
  }

  /* ---------- reveal + active nav on scroll ---------- */
  function initScroll() {
    const reveals = $$(".reveal");
    const links = $$(".links a");
    if (!("IntersectionObserver" in window)) { reveals.forEach(e => e.classList.add("in")); return; }

    const revealIO = new IntersectionObserver((entries) => {
      entries.forEach(en => {
        if (en.isIntersecting) { en.target.classList.add("in"); revealIO.unobserve(en.target); }
      });
    }, { rootMargin: "0px 0px -6% 0px", threshold: .06 });
    reveals.forEach(e => revealIO.observe(e));

    const secs = links.map(a => $(a.getAttribute("href"))).filter(Boolean);
    if (!secs.length) return;
    const spyIO = new IntersectionObserver((entries) => {
      entries.forEach(en => {
        if (!en.isIntersecting) return;
        links.forEach(l => {
          const on = l.getAttribute("href") === "#" + en.target.id;
          l.classList.toggle("on", on);
          if (on) l.setAttribute("aria-current", "true"); else l.removeAttribute("aria-current");
        });
      });
    }, { rootMargin: "-45% 0px -50% 0px" });
    secs.forEach(s => spyIO.observe(s));
  }

  function renderAll() {
    applyStatic(); renderTabs(); renderTagFilter(); renderGrid(); renderCombos(); renderBYO();
  }
  $("#langBtn").addEventListener("click", () => {
    lang = lang === "en" ? "ar" : "en";
    try { localStorage.setItem("saj-lang", lang); } catch (e) {}
    renderAll();
  });
  renderAll();
  initScroll();
})();
</script>
</body>
</html>
